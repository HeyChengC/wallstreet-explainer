  <div class="gold" id="l2" style="position:absolute;left:1000px;top:610px;width:400px;text-align:center;font-size:110px">$200<span class="y" style="font-size:80px">亿</span></div>

 <div style="position:absolute;left:0;right:0;top:330px;text-align:center;font:700 96px Shu;color:#fff" id="q1">手机里最值钱的不是 App</div>
 <div style="position:absolute;left:0;right:0;top:500px;text-align:center;font:700 150px Shu;color:#fff" id="q2">是<span class="gold" style="font-family:Shu">入口</span></div>

<script src="matte.js"></script><script>
const D=28, $=id=>document.getElementById(id);
window.timeline={duration:D};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ez=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const r=(t,a,b)=>ez(cl((t-a)/(b-a)));            // 0→1 从 a 到 b
const kf=(t,k)=>{if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++)if(t<=k[i][0]){const[a,va]=k[i-1],[b,vb]=k[i];const e=ez((t-a)/(b-a));return Array.isArray(va)?va.map((v,j)=>v+(vb[j]-v)*e):va+(vb-va)*e}return k[k.length-1][1]};
const S=[['s1',0,2.3],['s2',2.3,3.94],['s3',3.94,9.6],['s4',9.6,13.36],['s5',13.36,15.44],['s6',15.44,20.96],['s7',20.96,24.5],['s8',24.5,D]];
const SUB=[[0,3.9,'你在 iPhone 上用 Safari 搜个东西，谷歌就得给苹果分钱'],[3.94,7.45,'光二〇二二年，就分了两百亿美元'],[7.48,9.5,'这是反垄断官司里翻出来的'],
 [9.64,12.95,'Safari 里搜出来的广告钱，三成六归苹果'],[13.36,15.2,'皮查伊在法庭上亲口认了'],[15.44,17.9,'摊到每天，五千五百万美元'],[18,20.6,'差不多是苹果一年净利润的五分之一'],
 [20.96,24.4,'去年法院判了：这钱，还能接着付'],[24.52,27.4,'手机里最值钱的不是 App，是入口']];
const pad=n=>String(n).padStart(3,'0');
const imgs={}; function src(el,u){if(el.dataset.u!==u){el.src=u;el.dataset.u=u}}
const cam=(id,x,y,s)=>$(id).style.transform=`translate(${x}px,${y}px) scale(${s})`;
for(let i=0;i<20;i++){const d=document.createElement('div');d.className='dot';$('dots').appendChild(d)}
async function preload(){const L=[];for(let i=1;i<=34;i++)L.push(`wm/${pad(i)}.jpg`);for(let i=1;i<=18;i++)L.push(`ic/${pad(i)}.jpg`);
 for(let i=1;i<=72;i++)L.push(window.MATTE?`pc/${pad(i)}.png`:`pi/${pad(i)}.jpg`);
 await Promise.all(L.map(u=>new Promise(ok=>{const im=new Image();im.onload=im.onerror=ok;im.src=u})));await document.fonts.ready}
window.ready=preload();
window.seek=async function(t){
 $('st').style.transform=`scale(${innerWidth/1920})`;
 for(const[id,a,b]of S)$(id).style.display=(t>=a&&t<b)?'block':'none';
 const sb=SUB.find(s=>t>=s[0]&&t<s[1]);$('sub').textContent=sb?sb[2]:'';
 // 1 实拍：拿手机的人 → 点 Safari（放慢）
 if(t<1.05){src($('v1'),`wm/${pad(19+Math.min(15,Math.floor(t/1.05*16)))}.jpg`);$('v1').style.transform=`scale(${1+t*.03})`}
 else{src($('v1'),`ic/${pad(1+Math.min(17,Math.floor((t-1.05)/1.25*18)))}.jpg`);$('v1').style.transform=`scale(${1.02+(t-1.05)*.05})`}
 // 2 两个圆盘，一条线，钱沿线流
 cam('c2',0,0,1.3-.08*r(t,2.3,3.94));
 const p=r(t,2.45,2.9);$('ln').setAttribute('x2',610+700*p);
 [...$('dots').children].forEach((d,i)=>{const u=((t-2.95)*0.9-i*0.07);const on=t>2.95&&u>0;const f=u%1;d.style.display=on&&i<12?'block':'none';d.style.left=(610+700*f)+'px';d.style.top=(470+Math.sin(f*Math.PI)*-30)+'px';d.style.opacity=Math.min(1,f*6,(1-f)*6)});
 // 3 新闻摊在桌面 → 金色 200 亿 → 回到原文刷黄
 const tilt=kf(t,[[3.94,58],[5.9,52],[7.5,52],[8.3,20]]), sc=kf(t,[[3.94,.62],[5.9,.66],[7.5,.66],[8.3,1.0]]);
 const pan=kf(t,[[3.94,[260,60]],[5.9,[60,20]],[7.5,[60,20]],[8.3,[30,260]]]);
 $('desk').style.transform=`perspective(1500px) rotateX(${tilt}deg)`;
 $('plane').style.transform=`translate(${pan[0]}px,${pan[1]}px) scale(${sc})`;
 $('dim3').style.opacity=.15+.75*r(t,5.9,6.3)-.6*r(t,7.5,8.0);
 $('n200').style.opacity=r(t,5.9,6.25)*(1-r(t,7.45,7.8));
 $('n200').style.transform=`translateY(${(1-r(t,5.9,6.4))*40-r(t,7.45,7.8)*120}px) scale(${.94+.06*r(t,5.9,6.4)+.03*r(t,6.4,7.45)})`;
 $('hl2').style.transform=`scaleX(${r(t,4.6,5.2)})`;
 // 4 NBC 原文，推向 36%，刷黄
 cam('c4',kf(t,[[9.6,0],[13.36,-620]]),kf(t,[[9.6,0],[13.36,120]]),kf(t,[[9.6,1],[13.36,1.7]]));
 $('hl4').style.transform=`scaleX(${r(t,11.9,12.35)})`;
 // 5 皮查伊抠像 + 巨字
 const fi=1+Math.min(71,Math.max(0,Math.floor((t-13.36)*30)));src($('v5'),window.MATTE?`pc/${pad(fi)}.png`:`pi/${pad(fi)}.jpg`);
 if(!window.MATTE){$('v5').style.height='1080px';$('v5').style.bottom='0'}
 cam('c5',0,0,1.06-.06*r(t,13.36,15.44));
 const g=r(t,13.85,14.25);$('b36').style.opacity=g;$('bpc').style.opacity=g;
 $('b36').style.transform=`translateX(${(1-g)*120}px)`;$('bpc').style.transform=`translateX(${-(1-g)*120}px)`;
 $('nm5').style.opacity=r(t,13.5,13.8);
 // 6 每天 5500 万 → 镜头拉开成柱子：200 亿 vs 998 亿
 $('per').style.opacity=r(t,15.44,15.6)*(1-r(t,17.85,18.2));
 $('per').style.transform=`scale(${1+.04*r(t,15.5,17.9)}) translateY(${-60*r(t,17.85,18.3)}px)`;
 $('g55').style.opacity=r(t,16.5,16.8);$('g200').style.opacity=1-r(t,16.4,16.65);$('g200').style.transform=`translateY(${-50*r(t,16.4,16.65)}px)`;$('g55').style.transform=`translateY(${50*(1-r(t,16.5,16.8))}px)`;$('per').querySelector('.brow').style.opacity=r(t,15.9,16.2);
 $('chart').style.opacity=r(t,17.95,18.25);$('chart').style.transform=`perspective(1800px) rotateY(${kf(t,[[17.95,-16],[20.96,-6]])}deg)`;
 $('br2').style.transform=`scaleY(${r(t,18.0,18.5)})`;$('l2').style.opacity=r(t,18.3,18.6);$('t2').style.opacity=r(t,18.1,18.4);
 $('br1').style.transform=`scaleY(${r(t,18.6,19.5)})`;$('l1').style.opacity=r(t,19.3,19.6);$('t1').style.opacity=r(t,18.6,18.9);
 $('fifth').style.opacity=r(t,19.95,20.25);
 cam('c6',kf(t,[[15.44,0],[18,0],[19.5,40],[20.96,-120]]),kf(t,[[15.44,0],[18,0],[19.5,40],[20.96,-40]]),kf(t,[[15.44,1],[18,1.02],[19.5,.92],[20.96,1.05]]));
 // 7 2025 判决原文
 cam('c7',kf(t,[[20.96,60],[24.5,-200]]),kf(t,[[20.96,80],[24.5,160]]),kf(t,[[20.96,.82],[24.5,1.3]]));
 $('hl7a').style.transform=`scaleX(${r(t,22.4,22.6)})`;$('hl7b').style.transform=`scaleX(${r(t,22.6,23.2)})`;
 // 8 金句
 src($('v8'),`ic/${pad(1+Math.min(17,Math.max(0,Math.floor((t-24.5)/3.5*18))))}.jpg`);
 $('q1').style.opacity=r(t,24.55,24.9);$('q2').style.opacity=r(t,26.35,26.65);
 $('q2').style.transform=`scale(${.94+.06*r(t,26.35,26.9)})`;
 await Promise.all([...document.images].filter(i=>i.offsetParent&&!i.complete).map(i=>i.decode().catch(()=>{})));
};
</script></body></html>
